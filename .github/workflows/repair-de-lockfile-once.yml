name: Repair German review-branch lockfile
on:
  push:
    branches: [fix/haccora-de-lockfile-20261006]
    paths: [.github/workflows/repair-de-lockfile-once.yml]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.repository == 'asaffilate01-ship-it/haccora' && github.ref == 'refs/heads/fix/haccora-de-lockfile-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Align root lockfile without executing dependency lifecycle scripts
        run: |
          set -euo pipefail
          npx --yes --package=npm@10.9.9 npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          test "$(git diff --name-only)" = 'package-lock.json'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest=JSON.parse(readFileSync('package.json','utf8'));
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          for (const group of ['dependencies','devDependencies']) assert.deepEqual(lock.packages[''][group],manifest[group]);
          const name='@lovable.dev/vite-tanstack-config';
          assert.equal(lock.packages['node_modules/'+name].version,manifest.devDependencies[name]);
          NODE
          npx --yes --package=npm@10.9.9 npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile to this exact review branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/haccora-de-lockfile-20261006'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          test "$(git diff --name-only)" = 'package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix(deps): align German root lockfile with the declared build configuration'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD

name: Repair German mobile transitive audit
on:
  push:
    branches: [fix/haccora-de-lockfile-20261006]
    paths: [.github/workflows/repair-de-mobile-once.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'asaffilate01-ship-it/haccora' && github.ref == 'refs/heads/fix/haccora-de-lockfile-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Target only compression and source-map-js within existing mobile ranges
        working-directory: mobile
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/mobile-lock-before.json"
          npx --yes --package=npm@10.9.9 npm update compression source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json ../package.json ../package-lock.json
          test "$(git diff --name-only)" = 'mobile/package-lock.json'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/mobile-lock-before.json','utf8'));
          const next=JSON.parse(readFileSync('package-lock.json','utf8'));
          const manifest=JSON.parse(readFileSync('package.json','utf8'));
          for(const group of ['dependencies','devDependencies']) assert.deepEqual(next.packages[''][group],manifest[group]);
          for(const path of new Set([...Object.keys(before.packages),...Object.keys(next.packages)])) {
            if(JSON.stringify(before.packages[path])!==JSON.stringify(next.packages[path])) {
              assert(/(?:^|\/)node_modules\/(?:compression|source-map-js)$/.test(path),'Unexpected dependency change: '+path);
              console.log(path+': '+before.packages[path]?.version+' -> '+next.packages[path]?.version);
            }
          }
          NODE
          npx --yes --package=npm@10.9.9 npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:production
      - name: Commit only the reviewed mobile lockfile to the same branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/haccora-de-lockfile-20261006'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          test "$(git diff --name-only)" = 'mobile/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mobile/package-lock.json
          git commit -m 'fix(deps): patch German mobile compression and source-map-js without new audit waivers'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
